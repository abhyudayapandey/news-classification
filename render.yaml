# Render Blueprint - free tier deployment for Phase 1 verification.
#
# Why this exists: the sandbox this project was built in has restricted
# outbound network access and cannot reach news domains (or render.com
# itself) to verify RSS feeds live. Deploying here gives the app real,
# unrestricted internet access to fetch the actual feeds.
#
# preDeployCommand (the normal place to run migrations) requires a paid
# instance type on Render, so on the free `plan: free` instance migrations
# run at the end of buildCommand instead - safe to re-run on every deploy,
# Alembic no-ops once a migration is already applied.
#
# See README.md "Deploying to Render" for setup steps and what you still
# need to configure by hand in the Render dashboard (DATABASE_URL, etc -
# never commit real secrets here).

services:
  - type: web
    name: news-classification-api
    runtime: python
    plan: free
    buildCommand: "pip install -r requirements.txt && alembic upgrade head"
    startCommand: "uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: APP_ENV
        value: production
      - key: LOG_LEVEL
        value: INFO
      - key: EMBEDDING_PROVIDER
        value: local
      - key: LLM_PROVIDER
        value: local
      # Multilingual (includes Hindi) as of this swap from all-MiniLM-L6-v2
      # - see app/llm/local_embedding.py's docstring for why, and its
      # unverified memory footprint on this exact free tier: watch this
      # service's memory graph after the next deploy, since ~0.09GB to
      # ~0.22GB of ONNX weights may or may not still fit alongside the
      # rest of the app in 512MB. If it doesn't, fall back to
      # EMBEDDING_PROVIDER=openai or =gemini instead of shrinking further.
      - key: LOCAL_EMBEDDING_MODEL
        value: sentence-transformers/paraphrase-multilingual-MiniLM-L12-v2
      - key: OPENAI_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      # Phase 3 admin UI - signs session cookies. Required, no default: a
      # hardcoded/known key would let anyone forge a logged-in session.
      # Generate with: python -c "import secrets; print(secrets.token_hex(32))"
      - key: SECRET_KEY
        sync: false

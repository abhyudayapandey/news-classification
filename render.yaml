# Render Blueprint - free tier deployment for Phase 1 verification.
#
# Why this exists: the sandbox this project was built in has restricted
# outbound network access and cannot reach news domains (or render.com
# itself) to verify RSS feeds live. Deploying here gives the app real,
# unrestricted internet access to fetch the actual feeds.
#
# preDeployCommand (the normal place to run migrations) requires a paid
# instance type on Render, so on the free `plan: free` instance migrations
# run at the end of buildCommand instead - safe to re-run on every deploy,
# Alembic no-ops once a migration is already applied.
#
# See README.md "Deploying to Render" for setup steps and what you still
# need to configure by hand in the Render dashboard (DATABASE_URL, etc -
# never commit real secrets here).

services:
  - type: web
    name: news-classification-api
    runtime: python
    plan: free
    buildCommand: "pip install -r requirements.txt && alembic upgrade head"
    startCommand: "uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: APP_ENV
        value: production
      - key: LOG_LEVEL
        value: INFO
      # EMBEDDING_PROVIDER stays "local" (embedding is only used for
      # clustering/dedup, and no paid embedding provider is implemented -
      # see app/llm/factory.py's get_embedding_provider()). The
      # multilingual local embedding model (paraphrase-multilingual-
      # MiniLM-L12-v2) confirmed OOM on this free tier's 512MB during
      # ingestion - reverted to the original English-only all-MiniLM-L6-v2
      # to fix that. This does mean clustering/dedup quality for non-
      # English articles is weaker than for English ones (a real, smaller,
      # separate limitation from classification - exact wire-copy is
      # lexically similar enough to likely still cluster fine; more
      # paraphrased duplicates might not). See app/llm/local_embedding.py's
      # docstring for the full history of this back-and-forth.
      - key: EMBEDDING_PROVIDER
        value: local
      - key: LOCAL_EMBEDDING_MODEL
        value: sentence-transformers/all-MiniLM-L6-v2
      # LLM_PROVIDER (establishment classification AND entity sentiment -
      # see get_entity_sentiment_provider()'s own docstring on why they
      # share this one setting, which is also why this same switch covers
      # YouTube/X sentiment classification, not just article
      # classification) switched from "local" to "openai": the local
      # embedding-similarity classifier was giving Hindi-language local
      # outlets (config/outlets.yaml) near-random classification, since
      # embedding quality for classification purposes needs the SAME
      # model that's now reverted to English-only above for memory
      # reasons. Routing classification through a real LLM API instead
      # sidesteps that entirely - OpenAIClassificationProvider sends raw
      # text directly to the API, with no embedding-model dependency at
      # all, so it isn't affected by whichever (smaller, English-only)
      # model handles clustering.
      - key: LLM_PROVIDER
        value: openai
      # gpt-5-nano: cheapest OpenAI model as of this choice ($0.05/$0.40
      # per 1M input/output tokens - not independently verified against
      # OpenAI's own pricing page, which this build environment's egress
      # proxy blocks; cross-referenced from third-party pricing
      # aggregators instead), and per OpenAI's own docs explicitly
      # positioned for summarization/classification tasks like this one -
      # re-check openai.com/api/pricing before assuming this is still
      # optimal, model pricing shifts often.
      - key: OPENAI_MODEL
        value: gpt-5-nano
      - key: OPENAI_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      # Phase 3 admin UI - signs session cookies. Required, no default: a
      # hardcoded/known key would let anyone forge a logged-in session.
      # Generate with: python -c "import secrets; print(secrets.token_hex(32))"
      - key: SECRET_KEY
        sync: false

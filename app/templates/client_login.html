{% extends "public_base.html" %}
{% block title %}Client Portal Log In{% endblock %}
{% block footer %}{% endblock %}

{% block content %}
<div class="max-w-6xl mx-auto px-5 sm:px-8 py-16 sm:py-24 flex justify-center">
  <div class="w-full max-w-sm">
    <p class="text-[13px] font-semibold uppercase tracking-[0.1em] text-accent mb-3 text-center">Client portal</p>
    <h1 class="font-display text-2xl sm:text-3xl font-bold text-ink text-balance leading-tight mb-8 text-center">Log in to your dashboard</h1>

    <div class="bg-surface border border-line rounded-2xl p-6 sm:p-8">
      {% if error %}
      <div class="mb-5 px-4 py-3 rounded-xl bg-red-50 text-red-700 text-sm font-medium">{{ error }}</div>
      {% endif %}
      <form method="post" action="/client/login" class="flex flex-col gap-4">
        <div>
          <label for="username" class="block text-[13px] font-semibold text-ink-muted mb-1.5">Username</label>
          <input type="text" id="username" name="username" required autofocus
                 class="w-full bg-paper border border-line rounded-xl px-3.5 py-2.5 text-sm text-ink focus:outline-none focus:border-accent transition-colors">
        </div>
        <div>
          <label for="password" class="block text-[13px] font-semibold text-ink-muted mb-1.5">Password</label>
          <input type="password" id="password" name="password" required
                 class="w-full bg-paper border border-line rounded-xl px-3.5 py-2.5 text-sm text-ink focus:outline-none focus:border-accent transition-colors">
        </div>
        <button type="submit"
                class="mt-2 inline-flex items-center justify-center gap-1.5 text-sm font-semibold text-accent-ink bg-accent rounded-full px-4 py-2.5 hover:bg-accent-hover transition-colors">
          Log in
        </button>
      </form>
    </div>
  </div>
</div>
{% endblock %}

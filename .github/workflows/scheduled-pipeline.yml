name: Scheduled ingestion pipeline

# Runs the three manual-trigger endpoints (ingest -> process -> queue) on a
# schedule, since none of them run automatically on their own - see
# README.md "8. What's deliberately not here yet" / the Render deployment
# section. Chosen over a native Render Cron Job because Render's Cron Jobs
# are NOT free (minimum ~$1/month per job as of writing) - this keeps the
# $0 infrastructure constraint intact using GitHub Actions' free minutes.
#
# Once daily, not every 4 hours (its original cadence): this repo is
# private, and GitHub Free only includes 2,000 Actions minutes/month for
# private repos (public repos are unmetered). Switching classification to
# OpenAI (gpt-5-nano) made each run take far longer than the old pure-local
# classifier ever did - a single "Cluster + classify" step has taken 55+
# minutes - and at 6 runs/day that exhausted the entire month's quota by
# day 13, blocking every further run until the monthly reset ("recent
# account payments have failed or your spending limit needs to be
# increased" is GitHub's error for this, not a real payment problem).
# Once/day is this project's real long-term cadence - see if it holds up
# against the 2,000-minute budget before considering shrinking the
# per-call `limit` values below too, since total monthly minutes track
# total articles processed, not how many runs they're split across.
#
# process/run and queue/assign are both capped per call (network- and
# CPU-bound work per article on a free-tier instance), so each is looped
# until its own response says there's nothing left to do, rather than
# assuming one call drains the whole backlog.
#
# Both are also given a generous 600s per-call timeout and a modest
# per-call limit (20, not 50) - a batch that size can genuinely take
# several minutes on Render's free-tier CPU running a local embedding
# model, and process_articles()/assign_pending_articles() both commit
# per article, so a slow-but-still-working call isn't wasted work even
# if it does eventually time out - the next call (or tomorrow's cycle)
# just continues from wherever the DB actually is.
#
# Every call also goes through scripts/ci_curl_retry.sh's post_with_retry,
# which retries specifically on 502/503/504 - the free tier sleeps after
# ~15 minutes idle, so the app is asleep every time this daily cron fires,
# and Render's own gateway returns 502 while it wakes rather than waiting
# for it. See that script for why retrying is safe here.

on:
  schedule:
    - cron: "0 2 * * *" # once daily, 2 AM UTC
  workflow_dispatch: {} # allows a manual "Run workflow" trigger from the Actions tab

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    # Raised from 60: switching classification to OpenAI (gpt-5-nano) added
    # a real network round-trip per article (plus a second one for articles
    # with tracked entities), replacing what used to be pure in-process CPU
    # inference - noticeably slower per article than the local model ever
    # was. Comfortable margin before tomorrow's cron fires now that this
    # only runs once a day.
    timeout-minutes: 180
    env:
      # Set a repository variable named RENDER_APP_URL (Settings -> Secrets
      # and variables -> Actions -> Variables) if the deployed URL ever
      # changes - this default matches README.md section 6.2's "Status".
      APP_URL: ${{ vars.RENDER_APP_URL || 'https://news-classification-api-qp8a.onrender.com' }}
    steps:
      # Needed for scripts/ci_curl_retry.sh, sourced by every step below -
      # this job doesn't touch app code, but it does need that one file off
      # the repo checkout. Missing this step is exactly what broke the
      # first run after ci_curl_retry.sh was added: "No such file or
      # directory", since a fresh runner has nothing checked out by default.
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Ingest new articles from RSS feeds
        run: |
          source scripts/ci_curl_retry.sh
          resp=$(post_with_retry "$APP_URL/ingest/run" 300)
          body=$(echo "$resp" | sed '$d')
          code=$(echo "$resp" | tail -n1)
          echo "$body"
          if [ "$code" -ge 400 ]; then
            echo "::error::/ingest/run failed with HTTP $code"
            exit 1
          fi

      - name: Cluster + classify unprocessed articles
        run: |
          source scripts/ci_curl_retry.sh
          for i in $(seq 1 20); do
            resp=$(post_with_retry "$APP_URL/process/run?limit=20" 600)
            body=$(echo "$resp" | sed '$d')
            code=$(echo "$resp" | tail -n1)
            echo "$body"
            if [ "$code" -ge 400 ]; then
              echo "::error::/process/run failed with HTTP $code"
              exit 1
            fi
            remaining=$(echo "$body" | jq -r '.remaining_unprocessed // 0')
            if [ "$remaining" = "0" ]; then
              echo "Processing backlog drained."
              break
            fi
          done

      - name: Assign classified articles to admin queues (and backfill scrapes)
        run: |
          source scripts/ci_curl_retry.sh
          for i in $(seq 1 20); do
            resp=$(post_with_retry "$APP_URL/queue/assign?limit=20" 600)
            body=$(echo "$resp" | sed '$d')
            code=$(echo "$resp" | tail -n1)
            echo "$body"
            if [ "$code" -ge 400 ]; then
              echo "::error::/queue/assign failed with HTTP $code"
              exit 1
            fi
            assigned=$(echo "$body" | jq -r '.assigned // 0')
            rescraped=$(echo "$body" | jq -r '.rescraped // 0')
            if [ "$assigned" = "0" ] && [ "$rescraped" = "0" ]; then
              echo "Queue assignment/rescrape backlog drained."
              break
            fi
          done

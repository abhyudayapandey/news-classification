# Config-driven outlet list for RSS ingestion.
#
# IMPORTANT: I could not reach any of these hosts from this build environment
# to verify the feed URLs live - outbound network access here is restricted
# to a small allowlist (package registries, github, anthropic) and these
# news domains are not on it (confirmed via 403 from the egress proxy, not a
# feed-side problem). Every URL below (original three and the ones added
# after) is the outlet's documented/long-standing RSS endpoint, but you MUST
# verify all of them yourself before relying on this - run:
#
#   python -m app.ingestion.verify_feeds
#
# from a machine with normal internet access. Ingestion is fault-isolated
# per outlet (see IngestOutletResult.error), so a stale URL here won't break
# the others - it'll just show up as a per-outlet error you can fix by
# editing this file, no code changes or deploy needed.
#
# Deliberately mixes legacy broadsheets, digital-native outlets, and outlets
# across the general editorial spectrum - the point of the pro-/anti-
# establishment classifier is to judge individual articles' framing, not to
# pre-sort outlets by assumed leaning, so source diversity here matters more
# than picking outlets that "agree" with each other.

- name: The Hindu
  rss_feed_url: https://www.thehindu.com/news/national/feeder/default.rss
  is_active: true

- name: The Indian Express
  rss_feed_url: https://indianexpress.com/feed/
  is_active: true

- name: NDTV
  rss_feed_url: https://feeds.feedburner.com/ndtvnews-top-stories
  is_active: true

- name: Times of India
  rss_feed_url: https://timesofindia.indiatimes.com/rssfeedstopstories.cms
  is_active: true

- name: Hindustan Times
  rss_feed_url: https://www.hindustantimes.com/feeds/rss/india-news/rssfeed.xml
  is_active: true

- name: Scroll.in
  rss_feed_url: https://feeds.feedburner.com/ScrollinArticles.rss
  is_active: true

# The Wire and The Print are disabled, not deleted: /ingest/run confirmed
# via a live IngestOutletResult.error ("syntax error" at line 2) that their
# /feed URLs just redirect to the homepage, and checking page source by
# hand turned up no rss+xml <link> for The Wire and one for The Print that
# also redirects to a webpage rather than serving XML - i.e. not blocked,
# just no discoverable working feed right now. Flip is_active back to true
# if either publishes one later; no code change needed either way.
- name: The Wire
  rss_feed_url: https://thewire.in/feed
  is_active: false

- name: The Print
  rss_feed_url: https://theprint.in/feed/
  is_active: false

# Jodhpur/Udaipur local coverage - added for the two constituencies being
# pitched to directly (see app/processing/geography.py's
# _KNOWN_BARE_DISTRICTS for the matching change that goes with this).
# Both URLs confirmed live from a real browser (Safari's own "this is a
# link to an RSS feed" prompt, which only fires for actual RSS/XML content)
# - the one verification this build environment's blocked egress couldn't
# do itself. Unconfirmed: whether this is Patrika's Hindi or English edition
# feed (patrika.com's default is Hindi; /en/ is a separate section) - worth
# checking article language before assuming admin reviewers can read these
# blind the same way as the English-language outlets above.
- name: Rajasthan Patrika (Jodhpur)
  rss_feed_url: https://cms.patrika.com/googlefeed/blog/location/jodhpur-news
  is_active: true

- name: Rajasthan Patrika (Udaipur)
  rss_feed_url: https://cms.patrika.com/googlefeed/blog/location/udaipur-news
  is_active: true

# Independent Udaipur-only outlet (not part of the Patrika/Bhaskar
# networks above) - confirmed live by direct user verification.
- name: Udaipur News
  rss_feed_url: https://udaipurnews.in/feed/
  is_active: true

- name: Udaipur News Channel
  rss_feed_url: https://udaipurnewschannel.in/feed/
  is_active: true

# City News Rajasthan - a single WordPress site covering multiple
# Rajasthan cities via per-category feeds. Its URL structure is
# inconsistent across cities though: some are WordPress category pages
# (/category/<city>/feed/, confirmed for these four), others are
# top-level custom slugs instead (e.g. Baran is /baran-news/, not
# /category/baran/ - that guess returned a validly-formed but empty
# feed, confirmed by direct user verification, not this site's real
# Baran feed). Don't assume the /category/ pattern for any city not
# confirmed here - check each one individually.
- name: City News Rajasthan (Ajmer)
  rss_feed_url: https://citynewsrajasthan.com/category/ajmer/feed/
  is_active: true

- name: City News Rajasthan (Udaipur)
  rss_feed_url: https://citynewsrajasthan.com/category/udaipur/feed/
  is_active: true

- name: City News Rajasthan (Bikaner)
  rss_feed_url: https://citynewsrajasthan.com/category/bikaner/feed/
  is_active: true

- name: City News Rajasthan (Sikar)
  rss_feed_url: https://citynewsrajasthan.com/category/sikar/feed/
  is_active: true
